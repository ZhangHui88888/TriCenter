name: sbom

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend CycloneDX SBOM
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DskipTests
      - name: Frontend CycloneDX SBOM
        working-directory: frontend
        run: npm ci && npm sbom --sbom-format cyclonedx > bom.json
      - uses: actions/upload-artifact@v4
        with:
          name: tricenter-sbom
          path: |
            backend/target/bom.json
            backend/target/bom.xml
            frontend/bom.json
