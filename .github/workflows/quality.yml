name: quality

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run bundle:budget
      - run: npm run quality:type-debt
      - run: npm run knip
      - run: npm run jscpd
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp -Pquality-gate clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            backend/target/site/jacoco
            backend/target/pmd.xml
            backend/target/spotbugsXml.xml

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: tricenter-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: tricenter-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-root
          MYSQL_DATABASE: tricenter
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-root --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build executable application
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B -ntp package -DskipTests
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Replay Flyway migrations on an empty database
        env:
          DB_USER: root
          DB_PASSWORD: integration-root
          REDIS_HOST: 127.0.0.1
          REDIS_PASSWORD: ""
          JWT_SECRET: integration-only-jwt-secret-at-least-32-bytes
          TRICENTER_API_KEY: integration-only-booking-key
          CLAMAV_HOST: 127.0.0.1
        run: |
          set -euo pipefail
          export DB_URL='jdbc:mysql://127.0.0.1:3306/tricenter?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai'
          java -jar backend/target/tricenter-backend-*.jar --spring.profiles.active=prod > empty-db.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8082/actuator/health/readiness && break
            if ! kill -0 "$app_pid" 2>/dev/null; then cat empty-db.log; exit 1; fi
            test "$attempt" -lt 60 || { cat empty-db.log; exit 1; }
            sleep 2
          done
          test "$(mysql -h127.0.0.1 -uroot -pintegration-root -Nse 'SELECT MAX(CAST(version AS UNSIGNED)) FROM tricenter.flyway_schema_history WHERE success=1')" = "4"
          kill "$app_pid"
          wait "$app_pid" || true
          trap - EXIT
      - name: Exercise a version-2 baseline on an existing schema
        env:
          DB_USER: root
          DB_PASSWORD: integration-root
          REDIS_HOST: 127.0.0.1
          REDIS_PASSWORD: ""
          JWT_SECRET: integration-only-jwt-secret-at-least-32-bytes
          TRICENTER_API_KEY: integration-only-booking-key
          CLAMAV_HOST: 127.0.0.1
        run: |
          set -euo pipefail
          mysql -h127.0.0.1 -uroot -pintegration-root -e 'CREATE DATABASE tricenter_existing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          mysql -h127.0.0.1 -uroot -pintegration-root tricenter_existing < migrations/V001__baseline_current_schema.sql
          mysql -h127.0.0.1 -uroot -pintegration-root tricenter_existing < migrations/V002__seed_reference_data.sql
          export DB_URL='jdbc:mysql://127.0.0.1:3306/tricenter_existing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai'
          java -jar backend/target/tricenter-backend-*.jar \
            --spring.profiles.active=prod --server.port=8084 --management.server.port=8083 \
            --spring.flyway.baseline-on-migrate=true --spring.flyway.baseline-version=2 > baseline.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8083/actuator/health/readiness && break
            if ! kill -0 "$app_pid" 2>/dev/null; then cat baseline.log; exit 1; fi
            test "$attempt" -lt 60 || { cat baseline.log; exit 1; }
            sleep 2
          done
          test "$(mysql -h127.0.0.1 -uroot -pintegration-root -Nse 'SELECT MAX(CAST(version AS UNSIGNED)) FROM tricenter_existing.flyway_schema_history WHERE success=1')" = "4"
