version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups:
      spring:
        patterns: ["org.springframework*", "org.springframework.boot*"]
      quality:
        patterns: ["org.jacoco*", "net.sourceforge.pmd*", "com.github.spotbugs*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      react:
        patterns: ["react*", "@types/react*", "react-router-dom"]
      tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
