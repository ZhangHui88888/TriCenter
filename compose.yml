name: tricenter

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tricenter
      MYSQL_USER: tricenter
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [data]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [data]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/tricenter?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: tricenter
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_DATABASE: 1
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      TRICENTER_API_KEY: ${TRICENTER_API_KEY:?set TRICENTER_API_KEY}
      TRICENTER_UPLOAD_DIR: /var/lib/tricenter/uploads
      TRICENTER_QUARANTINE_DIR: /var/lib/tricenter/quarantine
    volumes:
      - uploads:/var/lib/tricenter/uploads
      - quarantine:/var/lib/tricenter/quarantine
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [edge, data]

  frontend:
    build:
      context: frontend
    restart: unless-stopped
    ports:
      - "${TRICENTER_HTTP_PORT:-3000}:80"
    depends_on:
      backend: { condition: service_healthy }
    networks: [edge]

networks:
  edge: {}
  data:
    internal: true

volumes:
  mysql-data: {}
  redis-data: {}
  uploads: {}
  quarantine: {}
