# 生产环境配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:1}
      connect-timeout: 1s
      timeout: 1s

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000

# 系统间API Key认证
tricenter:
  api-key: ${TRICENTER_API_KEY}
  cooperation-upload-dir: ${TRICENTER_UPLOAD_DIR:/var/lib/tricenter/uploads}
  upload-quarantine-dir: ${TRICENTER_QUARANTINE_DIR:/var/lib/tricenter/quarantine}
  auth:
    secure-cookie: true
    accept-bearer: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:8082}

# 日志配置
logging:
  level:
    com.tricenter: info
    org.springframework.security: warn
    org.apache.ibatis: warn
    org.mybatis: warn
    org.mybatis.spring: warn
    org.springframework.web.servlet.handler.HandlerMappingIntrospector: error
