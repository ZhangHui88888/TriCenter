# 开发环境配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tricenter?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 10000ms

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7天，单位毫秒

# 系统间API Key认证（Booking-miniapp调用使用）
tricenter:
  api-key: ${TRICENTER_API_KEY}
  auth:
    accept-bearer: true
  dev:
    seed-admin:
      enabled: ${TRICENTER_DEV_SEED_ADMIN:false}
      username: ${TRICENTER_DEV_ADMIN_USERNAME:}
      password: ${TRICENTER_DEV_ADMIN_PASSWORD:}

# 日志配置
logging:
  level:
    com.tricenter: info
    org.springframework.security: warn
    org.apache.ibatis: warn
    org.mybatis: warn
    org.mybatis.spring: warn
    org.springframework.web.servlet.handler.HandlerMappingIntrospector: error
